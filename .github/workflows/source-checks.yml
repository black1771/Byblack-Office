name: BYBLACK Office source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source integrity and shell syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Bash script syntax (do not execute scripts)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Check repository structure and manifest
        shell: bash
        run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v

      - name: Explain CI scope
        shell: bash
        run: |
          echo "PASS: repository structure, XML parsing and shell syntax checks."
          echo "NOT TESTED: APK compilation, runtime behavior, document editing, or license compliance."
