name: BYBLACK Office Java compile V3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-java-compile:
    name: Compile AssetClassLoader with Android SDK 34
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK and platform 34
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK root: $SDK_ROOT"
          if [ ! -f "$SDK_ROOT/platforms/android-34/android.jar" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              echo "::error::Android SDK command-line tools not present on runner"
              exit 1
            fi
            "$SDKMANAGER" --install "platforms;android-34"
          fi
          test -s "$SDK_ROOT/platforms/android-34/android.jar"

      - name: Compile real BYBLACK Java class against Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-ci/classes
          javac --release 8 \
            -cp "$ANDROID_HOME/platforms/android-34/android.jar" \
            -d build-ci/classes \
            app/src/com/byblack/office/AssetClassLoader.java
          test -s build-ci/classes/com/byblack/office/AssetClassLoader.class
          javap -classpath build-ci/classes com.byblack.office.AssetClassLoader

      - name: State compilation scope
        shell: bash
        run: |
          echo "PASS: AssetClassLoader.java compiled against Android SDK 34."
          echo "NOT TESTED: MainActivity.java, Apache POI, XMLBeans, PDFBox, DEX, APK or runtime."
